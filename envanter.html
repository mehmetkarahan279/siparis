<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayi Envanter - KBR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f1f5f9; color: #1e293b; }
        header { background: white; padding: 1rem 1.5rem; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; }
        header h1 { color: #1e40af; font-size: 1.3rem; }
        .back { color: #64748b; text-decoration: none; font-size: 0.9rem; }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 1.5rem; margin-bottom: 1.5rem; }
        .card h2 { margin-bottom: 1rem; font-size: 1.1rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; font-weight: 600; color: #475569; }
        .empty { text-align: center; padding: 3rem; color: #94a3b8; }
        .btn { background: #1e40af; color: white; border: none; padding: 0.6rem 1rem; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>📊 Bayi Envanter</h1>
        <a href="index.html" class="back">← Ana Sayfa</a>
    </header>
    <div class="container">
        <div class="card">
            <h2>Envanter Özeti</h2>
            <p style="color:#64748b; margin-bottom:1rem;">Bayi stok durumu ve ürün hareketleri burada listelenecek.</p>
            <button class="btn" onclick="alert('Envanter modülü yakında eklenecek.')">Yeni Envanter Kaydı</button>
        </div>
        <div class="card">
            <table>
                <thead>
                    <tr><th>Ürün Kodu</th><th>Ürün Adı</th><th>Bayi</th><th>Stok</th><th>Son Hareket</th></tr>
                </thead>
                <tbody>
                    <tr><td colspan="5" class="empty">Henüz envanter kaydı yok.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
